[package]
name = "todos"
version = "0.1.0"
description = "托盘待办：系统托盘常驻的轻量待办卡片（Tauri v2）"
edition = "2021"
rust-version = "1.85"

[lib]
name = "todos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-store = { path = "crates/todo-store" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"

[workspace]
members = ["crates/todo-store"]
resolver = "2"
